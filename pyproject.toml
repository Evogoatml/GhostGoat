[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-lattice"
version = "2.0.0"
description = "Enterprise Holonic Multi-Agent Coding Orchestrator — Lattice Sovereignty"
requires-python = ">=3.11"
dependencies = [
    # orchestration core
    "pycrdt>=0.10.0",
    "structlog>=25.1.0",
    "psutil>=7.0.0",
    "aiofiles>=24.1.0",
    "gitpython>=3.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    # data & validation
    "pydantic>=2.10.0",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    # API
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "flask>=2.0.0",
    "flask-cors>=4.0.0",
    # networking
    "httpx>=0.24.0",
    "aiohttp>=3.8.0",
    "websockets>=11.0",
    "requests>=2.31.0",
    "paramiko>=3.0.0",
    # LLM adapters
    "litellm>=1.60.0",
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "google-generativeai>=0.8.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-anthropic>=0.1.0",
    "semantic-router>=0.0.40",
    # storage & misc
    "redis>=4.5.0",
    "duckdb>=0.9.0",
    "msgpack>=1.0.0",
    "networkx>=3.0",
    "colorama>=0.4.4",
    "tqdm>=4.65.0",
    "python-dateutil>=2.8.0",
    "python-telegram-bot>=20.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "torchvision",
    "torchaudio",
    "peft",
    "scikit-learn>=1.2.0",
    "scipy>=1.7.0",
    # CPU build by default; for CUDA install faiss-gpu-cu12 manually instead
    "faiss-cpu>=1.7.4",
    "chromadb>=0.4.0",
    "gymnasium>=0.26.0",
    "pygame>=2.0.0",
    "matplotlib>=3.5.0",
    "plotly>=5.0.0",
]
crypto = [
    "cryptography>=41.0.0",
    "pycryptodome>=3.18.0",
    "liboqs-python>=0.9.0",
]
agents = [
    "crewai>=0.1.0",
    "langgraph>=0.1.0",
]
pentest = [
    "textual>=0.40.0",
    "rich>=13.0.0",
    "claude-agent-sdk>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "mypy>=0.990",
    "ruff>=0.1.0",
]
full = ["nexus-lattice[ml,crypto,agents,pentest,dev]"]

[project.scripts]
nexus = "main:main"

[tool.setuptools]
py-modules = ["main"]
