name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (supported path)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install smoke test
        run: pytest tests/test_install_smoke.py -v
